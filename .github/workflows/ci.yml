name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # Frank's self-hosted MacBook runner (faster than waiting for a GitHub macOS runner).
    runs-on: self-hosted
    # Never run pull requests from forks on the self-hosted machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package app bundle
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mac2Hog.app
          path: build/Mac2Hog.zip

  linux-core:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test core engine
        run: swift test
