name: Release

# Publishes a GitHub release with a signed-ad-hoc Mac2Hog.app (zip) and its SHA-256 checksum.
# Run it from the Actions tab ("Run workflow", enter the version) or by pushing a tag like v0.7.0.
# The version must match the VERSION file, and docs/release-notes/v<version>.md must exist.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match the VERSION file), e.g. 0.7.0"
        required: true
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    # Frank's self-hosted MacBook runner. Releases only run from manual dispatch or tag pushes on this repo.
    runs-on: self-hosted
    env:
      # Build outside the runner's work folder (it may live in an iCloud-synced folder like ~/Documents,
      # whose Finder metadata makes codesign fail).
      SCRATCH_PATH: /tmp/mac2hog-ci-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Resolve and check version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          FILE=$(tr -d '[:space:]' < VERSION)
          if [ "$V" != "$FILE" ]; then echo "::error::Version $V does not match VERSION ($FILE)"; exit 1; fi
          if [ ! -f "docs/release-notes/v$V.md" ]; then echo "::error::Missing docs/release-notes/v$V.md"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Test
        run: |
          xattr -cr . 2>/dev/null || true
          swift test --scratch-path "$SCRATCH_PATH"

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Package
        run: |
          cd build
          ZIP="Mac2Hog-$VERSION-macOS.zip"
          mv Mac2Hog.zip "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA=$(cut -d' ' -f1 "$ZIP.sha256")" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(mktemp)
          cat "docs/release-notes/v$VERSION.md" > "$NOTES"
          printf '\n---\n\n**SHA-256** `%s`  %s\n' "$SHA" "$ZIP" >> "$NOTES"
          gh release create "v$VERSION" "build/$ZIP" "build/$ZIP.sha256" \
            --title "Mac2Hog $VERSION" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
